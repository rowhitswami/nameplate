version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Must stay equal to engines.vscode in package.json, or packaging fails.
      - dependency-name: '@types/vscode'
      # Should describe the Node.js inside the oldest supported VS Code, not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
